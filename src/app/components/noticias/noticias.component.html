<div class="noticias-page">
  <div class="container">

    <div class="page-header text-center">
      <div class="page-eyebrow"><i class="bi bi-megaphone me-1"></i> Actualizaciones</div>
      <h1 class="page-title">Noticias y Novedades</h1>
      <p class="page-desc">Mantente al tanto de las últimas novedades de Envios Todopais</p>
    </div>

    <div class="row g-4">

      <div class="col-lg-4 col-md-6" *ngFor="let noticia of noticias; let i = index"
           [style.animation-delay]="(i * 0.1) + 's'">
        <div class="noticia-card" (click)="toggleDetalle(noticia.id)"
             [class.expanded]="noticiaSeleccionada === noticia.id">
          <div class="noticia-img-wrap">
            <img [src]="noticia.img" [alt]="noticia.titulo" />
            <div class="noticia-categoria">{{ noticia.categoria }}</div>
          </div>
          <div class="noticia-body">
            <div class="noticia-fecha">{{ noticia.fecha }}</div>
            <h3 class="noticia-titulo">{{ noticia.titulo }}</h3>
            <p class="noticia-resumen">{{ noticia.resumen }}</p>
            <div class="noticia-detalle" *ngIf="noticiaSeleccionada === noticia.id">
              <p>{{ noticia.detalle }}</p>
            </div>
            <button class="btn-leer">
              {{ noticiaSeleccionada === noticia.id ? 'Leer menos' : 'Leer más' }}
              <i class="bi" [class.bi-chevron-down]="noticiaSeleccionada !== noticia.id"
                            [class.bi-chevron-up]="noticiaSeleccionada === noticia.id"></i>
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
