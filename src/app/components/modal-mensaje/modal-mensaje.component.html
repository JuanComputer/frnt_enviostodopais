<div class="modal-overlay" *ngIf="visible" (click)="onCerrar()">
  <div class="modal-box" (click)="$event.stopPropagation()">

    <!-- Icono -->
    <div class="modal-icon" [class.success]="success" [class.error]="!success">
      <i class="bi" [class.bi-check-lg]="success" [class.bi-x-lg]="!success"></i>
    </div>

    <!-- Contenido -->
    <div class="modal-title">{{ titulo }}</div>
    <p class="modal-msg">{{ mensaje }}</p>

    <ng-container *ngIf="success && codigoTracking">
      <div class="tracking-box">
        <div class="tracking-label">Código de seguimiento</div>
        <div class="tracking-code">{{ codigoTracking }}</div>
      </div>
      <div class="estado-row" *ngIf="estado">
        <span class="estado-pill">{{ estado }}</span>
      </div>
    </ng-container>

    <button class="btn-cerrar" (click)="onCerrar()">
      <span *ngIf="success">Continuar</span>
      <span *ngIf="!success">Entendido</span>
    </button>
  </div>
</div>
