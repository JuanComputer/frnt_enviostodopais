<div class="contact-page">
  <div class="container">

    <div class="page-header text-center">
      <div class="page-eyebrow"><i class="bi bi-headset me-1"></i> Estamos para ayudarte</div>
      <h1 class="page-title">Contáctanos</h1>
      <p class="page-desc">Escríbenos y te responderemos a la brevedad</p>
    </div>

    <div class="row justify-content-center g-4">

      <!-- Info lateral -->
      <div class="col-lg-4">
        <div class="info-card">
          <div class="info-title">Información de contacto</div>
          <div class="info-item">
            <div class="info-icon"><i class="bi bi-envelope"></i></div>
            <div>
              <div class="info-label">Correo</div>
              <div class="info-value">contacto_enviostodopais.pe</div>
            </div>
          </div>
          <div class="info-item">
            <div class="info-icon"><i class="bi bi-telephone"></i></div>
            <div>
              <div class="info-label">Teléfono</div>
              <div class="info-value">+51 900 123 456</div>
            </div>
          </div>
          <div class="info-item">
            <div class="info-icon"><i class="bi bi-geo-alt"></i></div>
            <div>
              <div class="info-label">Sede principal</div>
              <div class="info-value">Lima, Perú</div>
            </div>
          </div>
          <div class="info-item">
            <div class="info-icon"><i class="bi bi-clock"></i></div>
            <div>
              <div class="info-label">Horario de atención</div>
              <div class="info-value">Lun–Sáb, 8am–6pm</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Formulario -->
      <div class="col-lg-6">
        <div class="form-card">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre completo</label>
              <input type="text" class="form-control" placeholder="Ej: Juan Pérez"
                     [(ngModel)]="name" name="name" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" placeholder="tu@correo.com"
                     [(ngModel)]="email" name="email" />
            </div>
            <div class="col-12">
              <label class="form-label">Asunto</label>
              <input type="text" class="form-control" placeholder="¿En qué podemos ayudarte?"
                     [(ngModel)]="asunto" name="asunto" />
            </div>
            <div class="col-12">
              <label class="form-label">Mensaje</label>
              <textarea class="form-control" rows="4"
                        placeholder="Describe tu consulta o problema con el mayor detalle posible..."
                        [(ngModel)]="message" name="message"></textarea>
            </div>
            <div class="col-12">
              <button class="btn-enviar" (click)="submitContact()" [disabled]="enviado">
                <span *ngIf="!enviado"><i class="bi bi-send"></i> Enviar mensaje</span>
                <span *ngIf="enviado"><i class="bi bi-check-lg"></i> Mensaje enviado</span>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
