<div class="login-wrapper">
  <div class="login-card">

    <!-- Header -->
    <div class="card-header-custom">
      <div class="brand-icon"><i class="bi bi-truck-front-fill"></i></div>
      <div class="brand-name">ENVIOS TODOPAIS</div>
      <div class="brand-sub">Portal de clientes</div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab" [class.active]="!resetMode" (click)="toggleResetMode(false)">
        <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
      </button>
      <button class="auth-tab" [class.active]="resetMode" (click)="toggleResetMode(true)">
        <i class="bi bi-key me-1"></i> Restablecer
      </button>
    </div>

    <!-- Body -->
    <div class="card-body-custom">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

        <!-- ══ LOGIN ══ -->
        <ng-container *ngIf="!resetMode">
          <div class="field-group">
            <label class="field-label">Correo electrónico</label>
            <div class="input-wrap">
              <i class="bi bi-envelope field-icon"></i>
              <input formControlName="correo" type="email" placeholder="tu@correo.com" autocomplete="email" />
            </div>
            <div class="field-error" *ngIf="form.get('correo')?.touched && form.get('correo')?.invalid">
              <i class="bi bi-exclamation-circle"></i> Correo inválido
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Contraseña</label>
            <div class="input-wrap">
              <i class="bi bi-lock field-icon"></i>
              <input formControlName="password" type="password" placeholder="••••••••" autocomplete="current-password" />
            </div>
            <div class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
              <i class="bi bi-exclamation-circle"></i> Mínimo 6 caracteres
            </div>
          </div>

          <div class="d-flex justify-content-end mb-3">
            <span class="link-muted" (click)="toggleResetMode(true)">¿Olvidaste tu contraseña?</span>
          </div>

          <button type="submit" class="btn-submit" [disabled]="isLoading">
            <span *ngIf="!isLoading"><i class="bi bi-box-arrow-in-right"></i> Ingresar</span>
            <span *ngIf="isLoading"><span class="spinner-border spinner-border-sm"></span> Verificando...</span>
          </button>
        </ng-container>

        <!-- ══ RESET PASSWORD ══ -->
        <ng-container *ngIf="resetMode">
          <p style="font-size:0.85rem; color:#64748b; margin-bottom:1.25rem; text-align:center;">
            Ingresa tu correo y DNI para restablecer tu contraseña.
          </p>

          <div class="field-group">
            <label class="field-label">Correo electrónico</label>
            <div class="input-wrap">
              <i class="bi bi-envelope field-icon"></i>
              <input formControlName="correo" type="email" placeholder="tu@correo.com" />
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">DNI</label>
            <div class="input-wrap">
              <i class="bi bi-credit-card field-icon"></i>
              <input formControlName="dni" type="text" placeholder="12345678" maxlength="8" />
            </div>
          </div>

          <div class="field-group">
            <label class="field-label">Nueva contraseña</label>
            <div class="input-wrap">
              <i class="bi bi-lock field-icon"></i>
              <input formControlName="nuevaPassword" type="password" placeholder="Mínimo 6 caracteres" />
            </div>
          </div>

          <button type="submit" class="btn-submit" [disabled]="isLoading">
            <span *ngIf="!isLoading"><i class="bi bi-check-lg"></i> Restablecer contraseña</span>
            <span *ngIf="isLoading"><span class="spinner-border spinner-border-sm"></span> Procesando...</span>
          </button>
        </ng-container>

      </form>
    </div>

    <!-- Footer -->
    <div class="card-footer-custom">
      © 2025 Envios Todopais · Todos los derechos reservados
    </div>
  </div>
</div>
