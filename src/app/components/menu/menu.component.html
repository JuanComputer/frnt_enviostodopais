<nav class="navbar navbar-expand-lg fixed-top" [class.scrolled]="isScrolled">
  <div class="container-fluid px-4">

    <!-- Logo / Marca -->
    <a class="navbar-brand" routerLink="/">
      <i class="bi bi-truck-front-fill"></i>
      ENVIOS TODOPAIS
    </a>

    <!-- Toggle mobile -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
      <ul class="navbar-nav mx-auto gap-1">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact:true}" class="nav-link">
            Inicio
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/cotizador" routerLinkActive="active-link" class="nav-link">Cotizador</a>
        </li>
        <li class="nav-item">
          <a routerLink="/ubicanos" routerLinkActive="active-link" class="nav-link">Ubícanos</a>
        </li>
        <li class="nav-item">
          <a routerLink="/noticias" routerLinkActive="active-link" class="nav-link">Noticias</a>
        </li>

        <!-- Operador / Admin -->
        <li class="nav-item" *ngIf="isAuthenticated && (userRole === 'Administrador' || userRole === 'Operador')">
          <a routerLink="/crear-envio" routerLinkActive="active-link" class="nav-link">
            <i class="bi bi-plus-circle me-1" style="font-size:0.8rem"></i>Registrar Envío
          </a>
        </li>
        <li class="nav-item" *ngIf="isAuthenticated && (userRole === 'Administrador' || userRole === 'Operador')">
          <a routerLink="/lista-envios" routerLinkActive="active-link" class="nav-link">
            <i class="bi bi-list-ul me-1" style="font-size:0.8rem"></i>Lista de Envíos
          </a>
        </li>

        <!-- Cliente -->
        <li class="nav-item" *ngIf="isAuthenticated && userRole === 'Cliente'">
          <a routerLink="/mis-envios" routerLinkActive="active-link" class="nav-link">Mis Envíos</a>
        </li>

        <li class="nav-item">
          <a routerLink="/contactanos" routerLinkActive="active-link" class="nav-link">Contáctanos</a>
        </li>
      </ul>

      <!-- Zona derecha -->
      <div class="d-flex align-items-center gap-2">
        <ng-container *ngIf="isAuthenticated; else loginBtn">
          <div class="user-menu">
            <button class="user-chip" (click)="toggleUserMenu()">
              <i class="bi bi-person-circle"></i>
              <span>{{ userName }}</span>
              <span class="role-badge">{{ userRole }}</span>
              <i class="bi bi-chevron-down" style="font-size:0.7rem; opacity:0.6"></i>
            </button>
            <div class="user-dropdown" *ngIf="showUserMenu">
              <button class="dropdown-item" (click)="logout()">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
              </button>
            </div>
          </div>
        </ng-container>

        <ng-template #loginBtn>
          <a routerLink="/auth" class="btn btn-zona">
            <i class="bi bi-door-open me-1"></i> Zona Clientes
          </a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
